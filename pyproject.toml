[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-domain-qa"
version = "1.0.0"
description = "Open-Domain Question Answering from Lexical Retrieval to RAG (CS60075 Assignment II)"
authors = [
    { name = "CS60075 NLP Group 29" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "nltk>=3.8.0",
    "datasets>=2.18.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
